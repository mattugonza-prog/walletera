name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    # Postgres real para los tests de la API.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: walletera
          POSTGRES_PASSWORD: walletera
          POSTGRES_DB: walletera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U walletera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://walletera:walletera@localhost:5432/walletera_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
